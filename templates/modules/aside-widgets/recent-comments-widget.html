<section
  th:fragment="recent-comments-widget"
  class="widget"
  th:with="
    commentsTitle=${item.comments_title ?: '最新评论'},
    commentsCount=${T(java.lang.Integer).parseInt(item.count ?: '5')},
    showReplies=${item.show_replies != null ? item.show_replies : true},
    replyCount=${T(java.lang.Integer).parseInt(item.reply_count ?: '3')},
    showAvatar=${item.show_avatar != null ? item.show_avatar : true},
    commentProvider=${theme.config.comment?.provider ?: 'halo'},
    haloCommentComponent=${theme.config.comment?.halo_component ?: 'official'},
    useCommentNextAnchor=${commentProvider == 'halo' and haloCommentComponent == 'next'},
    twikooEnvId=${theme.config.comment?.twikoo?.env_id ?: ''},
    twikooCustomUrl=${theme.config.comment?.twikoo?.custom_js_url ?: '/themes/theme-clarity/assets/libs/twikoo/twikoo.min.js'}
  "
>
  <hgroup class="widget-title">
    <span class="title-text text-creative" th:text="${commentsTitle}">最新评论</span>
  </hgroup>
  <div class="widget-body widget-card recent-comments-widget">
    <!-- Halo 原生评论 -->
    <th:block th:if="${commentProvider == 'halo'}">
      <th:block th:with="comments = ${commentFinder.list(null, 1, commentsCount)}">
        <ul
          class="recent-comments-list"
          th:if="${not #lists.isEmpty(comments.items)}"
          th:data-max-length="50"
          th:data-show-replies="${showReplies}"
          th:data-reply-count="${replyCount}"
          th:data-comment-anchor-mode="${useCommentNextAnchor ? 'comment-next' : 'official'}"
        >
          <li
            th:each="comment : ${comments.items}"
            class="recent-comment-item"
            th:data-comment-name="${comment.metadata.name}"
          >
            <div class="comment-header">
              <div class="comment-author-info">
                <img
                  th:if="${showAvatar and comment.owner != null and not #strings.isEmpty(comment.owner.avatar)}"
                  class="comment-avatar-img"
                  th:src="${comment.owner.avatar}"
                  th:alt="${comment.owner.displayName}"
                  loading="lazy"
                />
                <span
                  th:if="${showAvatar and (comment.owner == null or #strings.isEmpty(comment.owner.avatar))}"
                  class="comment-avatar-text"
                  th:text="${#strings.substring(comment.owner != null and not #strings.isEmpty(comment.owner.displayName) ? comment.owner.displayName : (comment.spec.owner != null ? comment.spec.owner.displayName : '匿名'), 0, 1)}"
                  >匿</span
                >
                <span
                  class="comment-author"
                  th:text="${comment.owner != null and not #strings.isEmpty(comment.owner.displayName) ? comment.owner.displayName : (comment.spec.owner != null ? comment.spec.owner.displayName : '匿名')}"
                  >评论者</span
                >
              </div>
              <time
                class="comment-time"
                th:datetime="${comment.metadata.creationTimestamp}"
                th:text="${#temporals.format(comment.metadata.creationTimestamp, 'MM-dd HH:mm')}"
                >时间</time
              >
            </div>
            <th:block th:if="${comment.spec.subjectRef != null}">
              <th:block th:if="${comment.spec.subjectRef.kind == 'SinglePage'}">
                <th:block th:with="singlePage = ${singlePageFinder.getByName(comment.spec.subjectRef.name)}">
                  <a
                    class="comment-link"
                    th:href="${singlePage.status.permalink + (useCommentNextAnchor ? '#comment-next-comment-' + comment.metadata.name : '#comment')}"
                  >
                    <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                    <div class="comment-content"></div>
                  </a>
                </th:block>
              </th:block>
              <th:block th:if="${comment.spec.subjectRef.kind == 'Post'}">
                <th:block th:with="post = ${postFinder.getByName(comment.spec.subjectRef.name)}">
                  <a
                    class="comment-link"
                    th:href="${post.status.permalink + (useCommentNextAnchor ? '#comment-next-comment-' + comment.metadata.name : '#comment')}"
                  >
                    <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                    <div class="comment-content"></div>
                  </a>
                </th:block>
              </th:block>
              <th:block th:if="${comment.spec.subjectRef.kind == 'Moment'}">
                <a
                  class="comment-link"
                  th:href="${'/moments/' + comment.spec.subjectRef.name + (useCommentNextAnchor ? '#comment-next-comment-' + comment.metadata.name : '#comment')}"
                >
                  <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                  <div class="comment-content"></div>
                </a>
              </th:block>
              <!-- TODO 文档插件未完全适配评论插件 -->
              <th:block th:if="${comment.spec.subjectRef.kind == 'Doc'}">
                <a class="comment-link" href="/docs">
                  <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                  <div class="comment-content"></div>
                </a>
              </th:block>
              <!-- 图库照片评论 -->
              <th:block th:if="${comment.spec.subjectRef.kind == 'Photo'}">
                <a
                  class="comment-link"
                  th:href="${'/photos/' + comment.spec.subjectRef.name + (useCommentNextAnchor ? '#comment-next-comment-' + comment.metadata.name : '#comment')}"
                >
                  <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                  <div class="comment-content"></div>
                </a>
              </th:block>
              <!-- TODO 友链插件未适配评论插件 -->
              <th:block th:if="${comment.spec.subjectRef.kind == 'Plugin'}">
                <a
                  class="comment-link"
                  th:href="${'/links' + (useCommentNextAnchor ? '#comment-next-comment-' + comment.metadata.name : '#comment')}"
                >
                  <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                  <div class="comment-content"></div>
                </a>
              </th:block>
            </th:block>
            <th:block th:if="${comment.spec.subjectRef == null}">
              <div class="comment-content-wrapper">
                <script type="text/plain" class="comment-raw-content" th:utext="${comment.spec.content}"></script>
                <div class="comment-content"></div>
              </div>
            </th:block>
            <div class="comment-replies" th:if="${showReplies and comment.status.replyCount > 0}">
              <th:block th:with="replies = ${commentFinder.listReply(comment.metadata.name, 1, replyCount)}">
                <div th:each="reply : ${replies.items}" class="reply-item" th:data-reply-name="${reply.metadata.name}">
                  <img
                    th:if="${showAvatar and reply.owner != null and not #strings.isEmpty(reply.owner.avatar)}"
                    class="reply-avatar-img"
                    th:src="${reply.owner.avatar}"
                    th:alt="${reply.owner.displayName}"
                    loading="lazy"
                  />
                  <span
                    th:if="${showAvatar and (reply.owner == null or #strings.isEmpty(reply.owner.avatar))}"
                    class="reply-avatar-text"
                    th:text="${#strings.substring(reply.owner != null and not #strings.isEmpty(reply.owner.displayName) ? reply.owner.displayName : (reply.spec.owner != null ? reply.spec.owner.displayName : '匿名'), 0, 1)}"
                    >匿</span
                  >
                  <span
                    class="reply-author"
                    th:text="${reply.owner != null and not #strings.isEmpty(reply.owner.displayName) ? reply.owner.displayName : (reply.spec.owner != null ? reply.spec.owner.displayName : '匿名')}"
                    >回复者</span
                  >
                  <script type="text/plain" class="reply-raw-content" th:utext="${reply.spec.content}"></script>
                  <a th:if="${useCommentNextAnchor}" class="reply-content reply-content-link" href="#"></a>
                  <span th:unless="${useCommentNextAnchor}" class="reply-content"></span>
                </div>
              </th:block>
            </div>
          </li>
        </ul>
        <div th:if="${#lists.isEmpty(comments.items)}" class="empty-tip">
          <span class="icon-[ph--chat-circle-dots-bold]"></span>
          暂无评论
        </div>
      </th:block>
    </th:block>

    <!-- Twikoo 评论 -->
    <th:block th:if="${commentProvider == 'twikoo' and not #strings.isEmpty(twikooEnvId)}">
      <ul
        class="recent-comments-list twikoo-recent-comments"
        th:data-env-id="${twikooEnvId}"
        th:data-page-size="${commentsCount}"
        th:data-max-length="50"
        th:data-show-avatar="${showAvatar}"
      >
        <!-- 内容由 JavaScript 动态加载 -->
      </ul>
      <div class="empty-tip twikoo-empty-tip" style="display: none">
        <span class="icon-[ph--chat-circle-dots-bold]"></span>
        暂无评论
      </div>
      <div class="twikoo-loading-tip">
        <span class="loading-spinner"></span>
        加载中...
      </div>
    </th:block>

    <!-- Twikoo 未配置提示 -->
    <th:block th:if="${commentProvider == 'twikoo' and #strings.isEmpty(twikooEnvId)}">
      <div class="empty-tip">
        <span class="icon-[ph--warning-bold]"></span>
        Twikoo 未配置
      </div>
    </th:block>

    <script>
      (function () {
        const widget = document.querySelector(".recent-comments-widget");
        if (!widget) return;

        const list = widget.querySelector(".recent-comments-list");
        if (!list) return;

        const parser = new DOMParser();

        const normalizeText = (value) => (value || "").replace(/\s+/g, " ").trim();

        const truncateText = (value, length) => {
          const text = normalizeText(value);
          return text.length > length ? `${text.substring(0, length)}...` : text;
        };

        const getSafeImageSource = (source) => {
          const rawSource = (source || "").trim();
          if (!rawSource) return "";

          try {
            const url = new URL(rawSource, window.location.origin);
            if (url.protocol === "data:" && !rawSource.startsWith("data:image/")) {
              return "";
            }
            return ["http:", "https:", "data:", "blob:"].includes(url.protocol) ? url.href : "";
          } catch (error) {
            return "";
          }
        };

        const getSafeMediaSource = (media) => {
          const source = media.getAttribute("src") || media.querySelector("source[src]")?.getAttribute("src") || "";
          const rawSource = source.trim();
          if (!rawSource) return "";

          try {
            const url = new URL(rawSource, window.location.origin);
            return ["http:", "https:", "blob:"].includes(url.protocol) ? url.href : "";
          } catch (error) {
            return "";
          }
        };

        const renderPreview = (target, raw, options = {}) => {
          const doc = parser.parseFromString(raw || "", "text/html");
          const hasMedia = Boolean(doc.body.querySelector("img[src], video, audio"));
          const maxLength = options.maxLength || 50;
          const imageLimit = options.imageLimit || 2;
          const mediaLimit = options.mediaLimit || 1;
          let remainingTextLength = maxLength;
          let imageCount = 0;
          let mediaCount = 0;

          target.replaceChildren();
          target.classList.toggle("has-media", hasMedia);

          if (!hasMedia) {
            target.textContent = truncateText(doc.body.textContent || doc.body.innerText || "", maxLength);
            return;
          }

          const mediaPreview = document.createElement("span");
          mediaPreview.className = "comment-media-preview";

          const appendText = (value) => {
            if (remainingTextLength <= 0) return;

            const text = normalizeText(value);
            if (!text) return;

            const previewText = document.createElement("span");
            previewText.className = "comment-preview-text";

            if (text.length > remainingTextLength) {
              previewText.textContent = `${text.substring(0, remainingTextLength)}...`;
              remainingTextLength = 0;
            } else {
              previewText.textContent = text;
              remainingTextLength -= text.length;
            }

            mediaPreview.appendChild(previewText);
          };

          const appendImage = (image) => {
            if (imageCount >= imageLimit) return;

            const source = getSafeImageSource(image.getAttribute("src"));
            if (!source) return;

            const previewImage = document.createElement("img");
            previewImage.className = "comment-preview-image";
            previewImage.src = source;
            previewImage.alt = image.getAttribute("alt") || "";
            previewImage.loading = "lazy";
            mediaPreview.appendChild(previewImage);
            imageCount += 1;
          };

          const appendMedia = (media) => {
            if (mediaCount >= mediaLimit) return;

            const source = getSafeMediaSource(media);
            if (!source) return;

            const tagName = media.tagName.toLowerCase();
            const previewMedia = document.createElement(tagName);
            previewMedia.className = `comment-preview-${tagName}`;
            previewMedia.src = source;
            previewMedia.preload = "metadata";

            if (tagName === "video") {
              previewMedia.muted = true;
              previewMedia.playsInline = true;
            } else {
              previewMedia.controls = true;
            }

            mediaPreview.appendChild(previewMedia);
            mediaCount += 1;
          };

          const walkNode = (node) => {
            if (node.nodeType === Node.TEXT_NODE) {
              appendText(node.textContent);
              return;
            }

            if (node.nodeType !== Node.ELEMENT_NODE) return;

            const tagName = node.tagName.toLowerCase();
            if (["script", "style", "template"].includes(tagName)) return;
            if (tagName === "img") {
              appendImage(node);
              return;
            }
            if (tagName === "video" || tagName === "audio") {
              appendMedia(node);
              return;
            }
            if (tagName === "br") {
              appendText(" ");
              return;
            }

            Array.from(node.childNodes).forEach(walkNode);
          };

          Array.from(doc.body.childNodes).forEach(walkNode);

          if (mediaPreview.childNodes.length > 0) {
            target.appendChild(mediaPreview);
          }
        };

        // Halo 原生评论处理
        if (!list.classList.contains("twikoo-recent-comments")) {
          const maxLength = parseInt(list.dataset.maxLength || "50", 10);
          const isCommentNextAnchor = list.dataset.commentAnchorMode === "comment-next";

          const getCommentBaseUrl = (item) => {
            const commentLink = item.querySelector(".comment-link[href]");
            return commentLink ? commentLink.href.split("#")[0] : "";
          };

          const run = () => {
            const items = list.querySelectorAll(".recent-comment-item");
            items.forEach((item) => {
              // 处理评论内容
              const rawScript = item.querySelector(".comment-raw-content");
              const contentDiv = item.querySelector(".comment-content");
              if (rawScript && contentDiv) {
                const raw = rawScript.textContent || rawScript.innerText || "";
                renderPreview(contentDiv, raw, { maxLength });
              }

              // 处理回复内容
              const replyItems = item.querySelectorAll(".reply-item");
              const commentBaseUrl = isCommentNextAnchor ? getCommentBaseUrl(item) : "";
              replyItems.forEach((replyItem) => {
                const replyRawScript = replyItem.querySelector(".reply-raw-content");
                const replyContentSpan = replyItem.querySelector(".reply-content");
                if (replyRawScript && replyContentSpan) {
                  const raw = replyRawScript.textContent || replyRawScript.innerText || "";
                  renderPreview(replyContentSpan, raw, { maxLength: 30, imageLimit: 1 });

                  if (isCommentNextAnchor && replyContentSpan.classList.contains("reply-content-link")) {
                    const replyName = replyItem.dataset.replyName;
                    if (commentBaseUrl && replyName) {
                      replyContentSpan.href = `${commentBaseUrl}#comment-next-reply-${replyName}`;
                    } else {
                      replyContentSpan.removeAttribute("href");
                    }
                  }
                }
              });
            });
          };

          window.requestIdleCallback ? requestIdleCallback(run) : run();
          return;
        }

        // Twikoo 评论处理
        const envId = list.dataset.envId;
        const pageSize = parseInt(list.dataset.pageSize || "5", 10);
        const maxLength = parseInt(list.dataset.maxLength || "50", 10);
        const showAvatar = list.dataset.showAvatar === "true";
        const loadingTip = widget.querySelector(".twikoo-loading-tip");
        const emptyTip = widget.querySelector(".twikoo-empty-tip");

        const loadTwikooComments = async () => {
          try {
            // 动态加载 Twikoo JS
            await new Promise((resolve, reject) => {
              if (window.twikoo && window.twikoo.getRecentComments) {
                resolve();
                return;
              }
              const script = document.createElement("script");
              script.src = "[[${twikooCustomUrl}]]";
              script.async = true;
              script.onload = () => resolve();
              script.onerror = () => reject(new Error("Twikoo 脚本加载失败"));
              document.head.appendChild(script);
            });

            const comments = await window.twikoo.getRecentComments({
              envId: envId,
              pageSize: pageSize,
              includeReply: false,
            });

            if (loadingTip) {
              loadingTip.style.display = "none";
            }

            if (!comments || comments.length === 0) {
              if (emptyTip) {
                emptyTip.style.display = "flex";
              }
              return;
            }

            comments.forEach((comment) => {
              const li = document.createElement("li");
              li.className = "recent-comment-item";

              // 格式化时间
              const date = new Date(comment.created);
              const isValidDate = !Number.isNaN(date.getTime());
              const timeStr = isValidDate
                ? `${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`
                : "";

              // 构建评论链接
              const commentUrl = comment.url ? `${comment.url}${comment.id ? `#${comment.id}` : ""}` : "#";

              const header = document.createElement("div");
              header.className = "comment-header";

              const authorInfo = document.createElement("div");
              authorInfo.className = "comment-author-info";

              // 头像(0.2.9+)
              if (showAvatar) {
                if (comment.avatar) {
                  const avatar = document.createElement("img");
                  avatar.className = "comment-avatar-img";
                  avatar.src = comment.avatar;
                  avatar.alt = comment.nick || "";
                  avatar.loading = "lazy";
                  authorInfo.appendChild(avatar);
                } else {
                  const avatarText = document.createElement("span");
                  avatarText.className = "comment-avatar-text";
                  avatarText.textContent = (comment.nick || "匿名").charAt(0);
                  authorInfo.appendChild(avatarText);
                }
              }

              const author = document.createElement("span");
              author.className = "comment-author";
              author.textContent = comment.nick || "匿名";
              authorInfo.appendChild(author);

              const time = document.createElement("time");
              time.className = "comment-time";
              time.dateTime = isValidDate ? date.toISOString() : String(comment.created || "");
              time.textContent = timeStr;

              header.appendChild(authorInfo);
              header.appendChild(time);

              const link = document.createElement("a");
              link.className = "comment-link";
              link.href = commentUrl;

              const content = document.createElement("div");
              content.className = "comment-content";
              renderPreview(content, comment.comment || comment.commentText || "", { maxLength });

              link.appendChild(content);
              li.appendChild(header);
              li.appendChild(link);

              list.appendChild(li);
            });

            // Swup 使用事件委托处理动态创建的链接，无需重新绑定
          } catch (error) {
            console.error("加载 Twikoo 最新评论失败:", error);
            if (loadingTip) {
              loadingTip.style.display = "none";
            }
            if (emptyTip) {
              emptyTip.style.display = "flex";
              emptyTip.innerHTML = '<span class="icon-[ph--warning-bold]"></span> 加载失败';
            }
          }
        };

        // 延迟加载 Twikoo 评论
        window.requestIdleCallback ? requestIdleCallback(loadTwikooComments) : setTimeout(loadTwikooComments, 100);
      })();
    </script>
  </div>
</section>
