<th:block th:each="group,groupStat : ${groups}">
  <section class="feed-group" th:if="${not #lists.isEmpty(group.links)}">
    <h3 class="feed-title" th:text="${group.spec.displayName}"></h3>
    <p
      th:if="${group.metadata.annotations?.get('description')}"
      class="feed-desc"
      th:text="${group.metadata.annotations.get('description')}"
    ></p>

    <menu class="feed-list">
      <li
        th:each="link,linkStat : ${group.links}"
        th:with="access=${(theme.config.links?.show_access_status != false) ? link.status?.verification?.access : null}, accessState=${access?.state?.name()}"
      >
        <div class="feed-card-wrapper" th:data-link="${link.spec.url}">
          <a th:href="${link.spec.url}" class="feed-card gradient-card" target="_blank" rel="noopener noreferrer">
            <div class="avatar">
              <img th:src="${link.spec.logo}" th:alt="${link.spec.displayName}" loading="lazy" />
              <i
                th:if="${accessState != null}"
                class="access-status"
                th:classappend="${accessState == 'ACCESSIBLE'} ? 'is-accessible' : (${accessState == 'INACCESSIBLE'} ? 'is-inaccessible' : 'is-checking')"
                th:title="${accessState == 'ACCESSIBLE'} ? '站点在线' : (${accessState == 'INACCESSIBLE'} ? '站点无法访问' : '可访问性检测中')"
              ></i>
            </div>
            <span class="author" th:text="${link.spec.displayName}"></span>
          </a>

          <div class="feed-tooltip">
            <div class="site-content">
              <img class="site-icon" th:src="${link.spec.logo}" th:alt="${link.spec.displayName}" />
              <div class="site-info">
                <h4 class="text-creative" th:text="${link.spec.displayName}"></h4>
                <code
                  class="domain"
                  th:text="${#strings.replace(#strings.replace(link.spec.url, 'https://', ''), 'http://', '')}"
                ></code>
              </div>
            </div>
            <div class="desc-content">
              <p th:text="${link.spec.description}"></p>
              <p class="remark access-remark" th:if="${accessState != null}">
                <i
                  class="access-status"
                  th:classappend="${accessState == 'ACCESSIBLE'} ? 'is-accessible' : (${accessState == 'INACCESSIBLE'} ? 'is-inaccessible' : 'is-checking')"
                ></i>
                <span th:if="${accessState == 'ACCESSIBLE'}">站点可访问</span>
                <span th:if="${accessState == 'CHECKING'}">正在检测可访问性…</span>
                <span
                  th:if="${accessState == 'INACCESSIBLE'}"
                  th:title="${access?.error}"
                  th:text="${access?.statusCode != null and access.statusCode > 0 ? '无法访问 (HTTP ' + access.statusCode + ')' : '无法访问'}"
                ></span>
              </p>
            </div>
          </div>
        </div>
      </li>
    </menu>
  </section>
</th:block>
