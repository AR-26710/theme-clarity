<th:block th:fragment="moments-head">
  <link
    rel="stylesheet"
    th:if="${pluginFinder.available('PluginMoments')}"
    data-swup-conditional="moments"
    th:href="@{/assets/dist/moments.css?v={version}(version=${theme.spec.version})}"
  />
  <script
    type="module"
    th:if="${pluginFinder.available('PluginMoments')}"
    data-swup-conditional="moments"
    th:src="@{/assets/dist/moments.js?v={version}(version=${theme.spec.version})}"
  ></script>
</th:block>
